services:
  business-pgsql:
    image: docker.io/library/postgres:17
    container_name: business-pgsql
    environment:
      POSTGRES_DB: MyCo
      POSTGRES_USER: test
      POSTGRES_PASSWORD: dbfit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - business-pgsql-data:/var/lib/postgresql/data
      - ./PostgreSQL/container-init.sql:/docker-entrypoint-initdb.d/01-business.sql:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d MyCo"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  business-mysql:
    image: docker.io/library/mysql:8.0
    container_name: business-mysql
    environment:
      MYSQL_DATABASE: MyCo
      MYSQL_USER: test
      MYSQL_PASSWORD: dbfit
      MYSQL_ROOT_PASSWORD: dbfit
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --log-bin-trust-function-creators=1
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - business-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utest", "-pdbfit", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  business-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: business-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Dbfit_sa1
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - business-mssql-data:/var/opt/mssql
      - ./schema.sqlserver:/work/schema.sqlserver:Z
      - ./SQLServer:/work/SQLServer:Z
      - ./Static:/work/Static:Z
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Dbfit_sa1 -C -Q 'SELECT 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  business-dbfit:
    image: localhost/jazd/dbfit:dev
    container_name: business-dbfit
    ports:
      - "127.0.0.1:8085:8085"
    volumes:
      - ./DbFit/BusinessSchema:/dbfit/FitNesseRoot/BusinessSchema:Z
    depends_on:
      business-pgsql:
        condition: service_healthy
      business-mysql:
        condition: service_healthy

volumes:
  business-pgsql-data:
  business-mysql-data:
  business-mssql-data:
